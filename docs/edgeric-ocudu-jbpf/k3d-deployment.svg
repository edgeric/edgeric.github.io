<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="dep-title dep-desc">
  <title id="dep-title">EdgeRIC with OCUDU-jbpf: end-to-end k3d deployment</title>
  <desc id="dep-desc">One k3d cluster on one Docker host. Namespace open5gs runs the Open5GS core. Namespace ran, from the Helm release ran, runs three pods. Pod srs-gnb-du1-0 holds the OCUDU gNB with its jbpf agent, a C++ ZMQ broker and N Duranta OAI UEs that exchange IQ samples over ZMQ, plus the srs-gnb-proxy container that takes codelet loads on port 30450. Pod jrtc-0 runs jrt-controller, its stream router and Python xApps, and jrtc-decoder. Pod edgeric-0 runs the EdgeRIC muApps. The gNB and jrtc share jbpf shared memory: reports and telemetry out, actions in. jrtc and edgeric-0 exchange reports and actions over Unix sockets. Both write metrics to VictoriaMetrics, which Grafana reads on NodePort 30490. The repo checkout is mounted into the pods as hostPath volumes.</desc>
  <defs>
    <marker id="dep-rep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
    <marker id="dep-act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0561b"/></marker>
    <marker id="dep-dat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker>
    <marker id="dep-dat-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3e4c59"/></marker>
    <marker id="dep-mgt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa3"/></marker>
    <marker id="dep-met" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker>
  </defs>
