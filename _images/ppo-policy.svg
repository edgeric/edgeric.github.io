<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 368" width="780" height="368" role="img" aria-labelledby="pp-title pp-desc">
  <title id="pp-title">The PPO scheduling policy</title>
  <desc id="pp-desc">Each UE's CQI and DL backlog from the report go through the same small network, with shared weights theta, which gives every UE a score. A softmax over the UEs turns the scores into a probability per UE, and the UE with the highest probability gets the next slot. Training: each slot's reward is the bytes sent in it, and every 5,000 slots a PPO update replaces theta.</desc>
  <defs>
    <marker id="pp-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/>
    </marker>
    <marker id="pp-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b82"/>
    </marker>
    <marker id="pp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0561b"/>
    </marker>
    <marker id="pp-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b4fa3"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; fill: #3e4c59; font-size: 14px; }
    .h { font-size: 15px; font-weight: 700; fill: #1f2933; }
    .b { font-weight: 700; fill: #1f2933; }
    .m { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; fill: #1f2933; }
    .s { font-size: 13px; fill: #616e7c; }
    .f { font-family: "Times New Roman", Times, "Liberation Serif", "DejaVu Serif", serif; font-style: italic; font-size: 19px; fill: #1f2933; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .state { fill: #e8f1fb; stroke: #2f6db5; stroke-width: 1.5; }
    .box { fill: #eef2f7; stroke: #5b6b82; stroke-width: 1.5; }
    .act { fill: #fdf0e8; stroke: #c0561b; stroke-width: 1.5; }
    .trn { fill: #f1ecfa; stroke: #6b4fa3; stroke-width: 1.5; }
    .ls { stroke: #2f6db5; stroke-width: 2; fill: none; }
    .ln { stroke: #5b6b82; stroke-width: 2; fill: none; }
    .la { stroke: #c0561b; stroke-width: 2.2; fill: none; }
    .lt { stroke: #6b4fa3; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .bar { fill: #9aa5b1; }
    .pick { fill: #c0561b; }
  </style>

  <rect width="780" height="368" fill="#ffffff"/>

  <!-- column heads -->
  <text class="h c" x="92" y="28">State</text>
  <text class="s c" x="92" y="46">per UE, from the report</text>
  <text class="h c" x="276" y="28">Shared network</text>
  <text class="s c" x="276" y="46">same weights θ for all UEs</text>
  <text class="h c" x="476" y="28">Policy</text>
  <text class="s c" x="476" y="46">probability per UE</text>
  <text class="h c" x="693" y="28">Action</text>
  <text class="s c" x="693" y="46">for slot t+1</text>

  <!-- state, one box per UE -->
  <rect class="state" x="12" y="69" width="160" height="34" rx="7"/>
  <text class="m" x="24" y="91">ue1</text><text class="s e" x="162" y="91">CQI 11 · 1.2 MB</text>
  <rect class="state" x="12" y="113" width="160" height="34" rx="7"/>
  <text class="m" x="24" y="135">ue2</text><text class="s e" x="162" y="135">CQI 7 · 3.0 MB</text>
  <rect class="state" x="12" y="157" width="160" height="34" rx="7"/>
  <text class="m" x="24" y="179">ue3</text><text class="s e" x="162" y="179">CQI 14 · 0.8 MB</text>
  <rect class="state" x="12" y="201" width="160" height="34" rx="7"/>
  <text class="m" x="24" y="223">ue4</text><text class="s e" x="162" y="223">CQI 9 · 2.4 MB</text>

  <line class="ls" x1="173" y1="86" x2="214" y2="86" marker-end="url(#pp-s)"/>
  <line class="ls" x1="173" y1="130" x2="214" y2="130" marker-end="url(#pp-s)"/>
  <line class="ls" x1="173" y1="174" x2="214" y2="174" marker-end="url(#pp-s)"/>
  <line class="ls" x1="173" y1="218" x2="214" y2="218" marker-end="url(#pp-s)"/>

  <!-- the same network, once per UE -->
  <rect class="box" x="216" y="69" width="120" height="34" rx="7"/>
  <text class="f c" x="276" y="92">f<tspan font-size="13" dy="4">θ</tspan></text>
  <rect class="box" x="216" y="113" width="120" height="34" rx="7"/>
  <text class="f c" x="276" y="136">f<tspan font-size="13" dy="4">θ</tspan></text>
  <rect class="box" x="216" y="157" width="120" height="34" rx="7"/>
  <text class="f c" x="276" y="180">f<tspan font-size="13" dy="4">θ</tspan></text>
  <rect class="box" x="216" y="201" width="120" height="34" rx="7"/>
  <text class="f c" x="276" y="224">f<tspan font-size="13" dy="4">θ</tspan></text>

  <line class="ln" x1="337" y1="86" x2="370" y2="86" marker-end="url(#pp-n)"/>
  <line class="ln" x1="337" y1="130" x2="370" y2="130" marker-end="url(#pp-n)"/>
  <line class="ln" x1="337" y1="174" x2="370" y2="174" marker-end="url(#pp-n)"/>
  <line class="ln" x1="337" y1="218" x2="370" y2="218" marker-end="url(#pp-n)"/>

  <!-- softmax and the probabilities -->
  <rect class="box" x="372" y="69" width="68" height="166" rx="7"/>
  <text class="b c" x="406" y="157">softmax</text>
  <line x1="452" y1="69" x2="452" y2="235" stroke="#c3c2b7" stroke-width="1"/>
  <rect class="bar" x="452" y="79" width="6" height="14" rx="2"/>
  <text class="s" x="464" y="91">0.06</text>
  <rect class="bar" x="452" y="123" width="2" height="14" rx="1"/>
  <text class="s" x="460" y="135">0.01</text>
  <rect class="pick" x="452" y="167" width="90" height="14" rx="2"/>
  <text class="b" x="548" y="179">0.90</text>
  <rect class="bar" x="452" y="211" width="3" height="14" rx="1.5"/>
  <text class="s" x="461" y="223">0.03</text>
  <text class="s c" x="476" y="258">highest wins; sampled in training</text>

  <!-- action -->
  <line class="la" x1="584" y1="174" x2="616" y2="174" marker-end="url(#pp-a)"/>
  <rect class="act" x="618" y="157" width="150" height="34" rx="7"/>
  <text class="b c" x="693" y="179">ue3 gets the slot</text>

  <!-- training -->
  <line class="lt" x1="693" y1="192" x2="693" y2="296" marker-end="url(#pp-t)"/>
  <rect class="trn" x="618" y="298" width="150" height="52" rx="7"/>
  <text class="b c" x="693" y="319">Reward</text>
  <text class="s c" x="693" y="339">bytes sent in that slot</text>
  <line class="lt" x1="616" y1="324" x2="358" y2="324" marker-end="url(#pp-t)"/>
  <text class="s c" x="487" y="316">state, action, reward per slot</text>
  <rect class="trn" x="196" y="298" width="160" height="52" rx="7"/>
  <text class="b c" x="276" y="319">PPO update</text>
  <text class="s c" x="276" y="339">every 5,000 slots</text>
  <line class="lt" x1="276" y1="297" x2="276" y2="237" marker-end="url(#pp-t)"/>
  <text class="s" x="286" y="272">new θ</text>

  <!-- key -->
  <line class="ln" x1="12" y1="314" x2="40" y2="314"/>
  <text class="s" x="48" y="318">every slot, ~70 µs</text>
  <line class="lt" x1="12" y1="338" x2="40" y2="338"/>
  <text class="s" x="48" y="342">training</text>
</svg>
