  <text x="634.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">60</text>
  <line x1="704.0" y1="92" x2="704.0" y2="302" stroke="#e4e7eb" stroke-width="1"/>
  <text x="704.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">70</text>
  <text x="704.0" y="340.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="end">Mbit/s</text>
