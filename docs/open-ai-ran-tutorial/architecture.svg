<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" width="800" height="552" role="img" aria-labelledby="ta-title ta-desc">
  <title id="ta-title">Open AI-RAN tutorial testbed</title>
  <desc id="ta-desc">One k3d cluster. Namespace open5gs runs the Open5GS core with iperf3 servers. Namespace ran runs pod srs-gnb-du1-0 with the OCUDU gNB and jbpf agent (container ocudujbpf), the C++ ZMQ broker (grbroker) and N Duranta OAI UEs with one channel each (durue1); pod jrtc-0 with jrt-controller, its Python xApps and the protobuf decoder; pod edgeric-0 with the EdgeRIC-RT muApps; VictoriaMetrics and Grafana. The core and the gNB talk over N2 and N3, the gNB and jrtc over jbpf IPC, jrtc and the muApps over Unix sockets, and jrtc writes metrics to VictoriaMetrics, which Grafana queries.</desc>
  <defs>
    <marker id="ta-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; fill: #3e4c59; font-size: 13.5px; }
    .t { font-size: 15px; font-weight: 700; fill: #1f2933; }
    .b { font-size: 14px; font-weight: 600; fill: #1f2933; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .lbl { font-size: 12.5px; fill: #616e7c; }
    .ns { fill: none; stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .pod { fill: #ffffff; stroke: #7b8794; stroke-width: 1.2; }
    .link { stroke: #3e4c59; stroke-width: 1.7; fill: none; }
  </style>

  <rect width="800" height="552" fill="#ffffff"/>

  <!-- cluster -->
  <rect x="8" y="8" width="784" height="536" rx="14" fill="#fbfcfd" stroke="#9aa5b1" stroke-width="1.2"/>
  <text class="t" x="26" y="35">k3d cluster</text>
  <text class="mono" x="120" y="35" style="fill:#616e7c">janus-cluster</text>

  <!-- ns open5gs -->
  <rect class="ns" x="20" y="54" width="174" height="226" rx="10"/>
  <text class="mono" x="32" y="73" style="fill:#616e7c">ns: open5gs</text>
  <rect x="32" y="84" width="150" height="184" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.4"/>
  <text class="b c" x="107" y="108">Open5GS core</text>
  <g fill="#ffffff" stroke="#9aa5b1" stroke-width="1">
    <rect x="44" y="120" width="126" height="28" rx="6"/>
    <rect x="44" y="154" width="126" height="28" rx="6"/>
    <rect x="44" y="188" width="126" height="28" rx="6"/>
    <rect x="44" y="222" width="126" height="28" rx="6"/>
  </g>
  <text class="c" x="107" y="139" style="font-size:13px">AMF · SMF · UPF</text>
  <text class="c" x="107" y="173" style="font-size:13px">NRF · UDM · PCF</text>
  <text class="c" x="107" y="207" style="font-size:13px">MongoDB</text>
  <text class="c" x="107" y="241" style="font-size:13px">iperf3 servers</text>

  <!-- ns ran -->
  <rect class="ns" x="250" y="54" width="530" height="478" rx="10"/>
  <text class="mono" x="262" y="73" style="fill:#616e7c">ns: ran</text>

  <!-- pod srs-gnb-du1-0 -->
  <rect class="pod" x="266" y="84" width="498" height="170" rx="10"/>
  <text class="mono" x="280" y="104" style="fill:#52606d">pod: srs-gnb-du1-0</text>
  <rect x="280" y="114" width="470" height="38" rx="7" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.2"/>
  <text class="b" x="296" y="138">OCUDU gNB + jbpf agent</text>
  <text class="mono e" x="736" y="138" style="fill:#2f6db5">ocudujbpf</text>
  <rect x="280" y="160" width="470" height="38" rx="7" fill="#fdf3e3" stroke="#b7791f" stroke-width="1.2"/>
  <text class="b" x="296" y="184">C++ ZMQ broker · one thread · ipc://</text>
  <text class="mono e" x="736" y="184" style="fill:#9c6516">grbroker</text>
  <rect x="280" y="206" width="470" height="38" rx="7" fill="#f3f8f3" stroke="#4f8a55" stroke-width="1.2"/>
  <text class="b" x="296" y="230">N Duranta OAI UEs · one channel each</text>
  <text class="mono e" x="736" y="230" style="fill:#3b7a43">durue1</text>

  <!-- pod jrtc-0 -->
  <rect class="pod" x="266" y="304" width="318" height="118" rx="10"/>
  <text class="mono" x="280" y="324" style="fill:#52606d">pod: jrtc-0</text>
  <rect x="280" y="334" width="290" height="36" rx="7" fill="#f1ecfa" stroke="#6b4fa3" stroke-width="1.2"/>
  <text class="b" x="294" y="357" style="font-size:13.5px">jrt-controller + Python xApps</text>
  <text class="mono e" x="558" y="357" style="fill:#6b4fa3">jrtc</text>
  <rect x="280" y="376" width="290" height="36" rx="7" fill="#f2f3f5" stroke="#9aa5b1" stroke-width="1.2"/>
  <text class="b" x="294" y="399" style="font-size:13.5px">protobuf decoder</text>
  <text class="mono e" x="558" y="399" style="fill:#52606d">jrtc-decoder</text>

  <!-- pod edgeric-0 -->
  <rect class="pod" x="620" y="304" width="144" height="118" rx="10"/>
  <text class="mono" x="632" y="324" style="fill:#52606d">pod: edgeric-0</text>
  <rect x="632" y="334" width="120" height="78" rx="7" fill="#e6f6f4" stroke="#2c7a7b" stroke-width="1.2"/>
  <text class="b c" x="692" y="360">EdgeRIC-RT</text>
  <text class="b c" x="692" y="378">muApps</text>
  <text class="lbl c" x="692" y="398">PyTorch (CPU)</text>

  <!-- metrics -->
  <rect x="266" y="464" width="220" height="54" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.4"/>
  <text class="b c" x="376" y="487">VictoriaMetrics</text>
  <text class="mono c" x="376" y="506" style="fill:#616e7c">:30491</text>
  <rect x="544" y="464" width="220" height="54" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.4"/>
  <text class="b c" x="654" y="487">Grafana</text>
  <text class="mono c" x="654" y="506" style="fill:#616e7c">:30490</text>

  <!-- links -->
  <line class="link" x1="184" y1="133" x2="278" y2="133" marker-start="url(#ta-a)" marker-end="url(#ta-a)"/>
  <text class="lbl c" x="222" y="124">N2 / N3</text>
  <line class="link" x1="420" y1="256" x2="420" y2="302" marker-start="url(#ta-a)" marker-end="url(#ta-a)"/>
  <text class="lbl" x="432" y="284">jbpf IPC (/dev/shm, /tmp/jbpf)</text>
  <line class="link" x1="586" y1="372" x2="618" y2="372" marker-start="url(#ta-a)" marker-end="url(#ta-a)"/>
  <text class="lbl c" x="602" y="363" style="font-size:12px">UDS</text>
  <line class="link" x1="376" y1="424" x2="376" y2="462" marker-end="url(#ta-a)"/>
  <text class="lbl" x="388" y="448">InfluxDB line protocol</text>
  <line class="link" x1="488" y1="491" x2="542" y2="491" marker-end="url(#ta-a)"/>
  <text class="lbl c" x="515" y="482" style="font-size:12px">PromQL</text>
</svg>
