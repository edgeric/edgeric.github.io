<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="uc-title uc-desc">
  <title id="uc-title">Channel signal flow for UE i</title>
  <desc id="uc-desc">Downlink: the gNB output s[k] is copied by the broker to every UE; in UE i the received x[k] goes through a summing junction that adds sigma_b times w[k], with w[k] complex Gaussian of unit power, giving y[k] for the OAI PHY. Uplink: the PHY output x[k] is multiplied by g_b; the broker sums y_i[k] over all UEs and adds n[k], complex Gaussian with power N_floor, giving r[k] for the gNB. sigma_b and g_b are computed once per block from the SNR source (trace row or base model) and from reference powers P_ref measured over the first 1.5 s.</desc>
  <defs>
    <marker id="uc-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/>
    </marker>
    <marker id="uc-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b4fa3"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; fill: #3e4c59; font-size: 13.5px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: 700; fill: #1f2933; }
    .h { font-size: 13.5px; font-weight: 700; fill: #1f2933; }
    .eq { font-family: "Times New Roman", Times, "Liberation Serif", "DejaVu Serif", serif; font-size: 15px; font-style: italic; fill: #1f2933; }
    .s { font-size: 12.5px; fill: #616e7c; }
    .st { text-anchor: start; }
    .sub { font-size: 10.5px; }
    .sig { stroke: #3e4c59; stroke-width: 1.6; fill: none; }
    .par { stroke: #6b4fa3; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; }
    .op { fill: #ffffff; stroke: #3e4c59; stroke-width: 1.6; }
  </style>

  <rect width="800" height="560" fill="#ffffff"/>

  <!-- regions -->
  <rect x="64" y="20" width="228" height="526" rx="10" fill="#fdf8ef" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="t" x="178" y="42">C++ ZMQ broker</text>
  <text class="s" x="178" y="60">paced at f<tspan class="sub" dy="3">s</tspan><tspan dy="-3"> = 23.04 MS/s</tspan></text>
  <rect x="304" y="20" width="434" height="526" rx="10" fill="#f3f8f3" stroke="#4f8a55" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="t" x="521" y="42">UE i: ZMQ radio driver</text>
  <text class="s" x="521" y="60">σ<tspan class="sub" dy="3">b</tspan><tspan dy="-3"> and g</tspan><tspan class="sub" dy="3">b</tspan><tspan dy="-3"> fixed for block b (about one slot)</tspan></text>

  <!-- terminals -->
  <rect x="14" y="64" width="36" height="436" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
  <text class="t" transform="translate(37 282) rotate(-90)">OCUDU gNB</text>
  <text class="s" x="32" y="84">tx</text>
  <text class="s" x="32" y="490">rx</text>
  <rect x="750" y="64" width="36" height="436" rx="6" fill="#ffffff" stroke="#4f8a55" stroke-width="1.5"/>
  <text class="t" transform="translate(773 282) rotate(-90)">OAI nr-UE i PHY</text>
  <text class="s" x="768" y="84">rx</text>
  <text class="s" x="768" y="490">tx</text>

  <!-- ===== downlink ===== -->
  <line class="sig" x1="50" y1="92" x2="106" y2="92" marker-end="url(#uc-s)"/>
  <text class="eq" x="80" y="84">s[k]</text>
  <circle cx="110" cy="92" r="3.5" fill="#3e4c59"/>
  <polyline class="sig" points="110,92 110,136 146,136" marker-end="url(#uc-s)"/>
  <text class="s st" x="152" y="140">to UEs j ≠ i</text>
  <line class="sig" x1="110" y1="92" x2="346" y2="92"/>
  <text class="eq" x="210" y="84">x<tspan class="sub" dy="3">i</tspan><tspan dy="-3">[k] = s[k]</tspan></text>
  <text class="eq" x="326" y="84">x[k]</text>
  <circle cx="346" cy="92" r="3.5" fill="#3e4c59"/>
  <line class="sig" x1="346" y1="92" x2="636" y2="92" marker-end="url(#uc-s)"/>
  <circle class="op" cx="650" cy="92" r="12"/>
  <line class="sig" x1="643" y1="92" x2="657" y2="92"/>
  <line class="sig" x1="650" y1="85" x2="650" y2="99"/>
  <line class="sig" x1="662" y1="92" x2="748" y2="92" marker-end="url(#uc-s)"/>
  <text class="eq" x="705" y="84">y[k]</text>

  <!-- noise branch -->
  <rect x="492" y="136" width="120" height="30" rx="5" fill="#ffffff" stroke="#7b8794" stroke-width="1.3"/>
  <text class="eq" x="552" y="156">w[k] ~ <tspan style="font-style:normal">CN</tspan>(0, 1)</text>
  <line class="sig" x1="612" y1="151" x2="636" y2="151" marker-end="url(#uc-s)"/>
  <circle class="op" cx="650" cy="151" r="12"/>
  <line class="sig" x1="645" y1="146" x2="655" y2="156"/>
  <line class="sig" x1="645" y1="156" x2="655" y2="146"/>
  <line class="sig" x1="650" y1="139" x2="650" y2="106" marker-end="url(#uc-s)"/>
  <text class="eq st" x="660" y="127" style="font-size:14px">σ<tspan class="sub" dy="3">b</tspan><tspan dy="-3"> w[k]</tspan></text>

  <!-- DL reference power -->
  <line class="sig" x1="346" y1="96" x2="346" y2="194" marker-end="url(#uc-s)"/>
  <rect x="318" y="196" width="170" height="58" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.3"/>
  <text class="eq" x="403" y="216">P<tspan class="sub" dy="3">ref,DL</tspan></text>
  <text x="403" y="234">peak block power</text>
  <text class="s" x="403" y="249">over the first 1.5 s</text>
  <line class="par" x1="488" y1="225" x2="554" y2="225" marker-end="url(#uc-p)"/>

  <!-- noise level -->
  <rect x="556" y="196" width="176" height="58" rx="6" fill="#fde8e1" stroke="#c0533b" stroke-width="1.3"/>
  <text class="h" x="644" y="216">Noise level</text>
  <text class="eq" x="644" y="241">σ<tspan class="sub" dy="4">b</tspan><tspan dy="-9" class="sub">2</tspan><tspan dy="5"> = P</tspan><tspan class="sub" dy="4">ref,DL</tspan><tspan dy="-4"> / snr</tspan><tspan class="sub" dy="4">DL,b</tspan></text>
  <line class="par" x1="650" y1="196" x2="650" y2="165" marker-end="url(#uc-p)"/>
  <text class="eq st" x="658" y="186" style="font-size:14px">σ<tspan class="sub" dy="3">b</tspan></text>

  <!-- SNR source -->
  <rect x="430" y="280" width="180" height="60" rx="6" fill="#f1ecfa" stroke="#6b4fa3" stroke-width="1.3"/>
  <text class="h" x="520" y="300">SNR source</text>
  <text x="520" y="318">trace row at t<tspan class="sub" dy="3">b</tspan><tspan dy="-3"> − T,</tspan></text>
  <text x="520" y="334">else the base model</text>
  <line class="par" x1="590" y1="280" x2="590" y2="258" marker-end="url(#uc-p)"/>
  <text class="eq st" x="598" y="274" style="font-size:13.5px">SNR<tspan class="sub" dy="3">DL,b</tspan></text>
  <line class="par" x1="450" y1="340" x2="450" y2="362" marker-end="url(#uc-p)"/>
  <text class="eq st" x="458" y="357" style="font-size:13.5px">SNR<tspan class="sub" dy="3">UL,b</tspan></text>
  <line class="par" x1="306" y1="310" x2="428" y2="310" marker-end="url(#uc-p)"/>
  <text class="s" x="366" y="302">trace, T</text>
  <text class="s" x="366" y="326">from ue&lt;i&gt;.ctl</text>

  <!-- UL gain -->
  <rect x="312" y="366" width="206" height="58" rx="6" fill="#fde8e1" stroke="#c0533b" stroke-width="1.3"/>
  <text class="h" x="415" y="386">UL gain</text>
  <text class="eq" x="415" y="411">g<tspan class="sub" dy="4">b</tspan><tspan dy="-9" class="sub">2</tspan><tspan dy="5"> = snr</tspan><tspan class="sub" dy="4">UL,b</tspan><tspan dy="-4"> N</tspan><tspan class="sub" dy="4">floor</tspan><tspan dy="-4"> / P</tspan><tspan class="sub" dy="4">ref,UL</tspan></text>
  <line class="par" x1="416" y1="424" x2="416" y2="456" marker-end="url(#uc-p)"/>
  <text class="eq st" x="424" y="446" style="font-size:14px">g<tspan class="sub" dy="3">b</tspan></text>

  <!-- UL reference power -->
  <rect x="560" y="366" width="172" height="58" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.3"/>
  <text class="eq" x="646" y="386">P<tspan class="sub" dy="3">ref,UL</tspan></text>
  <text x="646" y="404">peak block power</text>
  <text class="s" x="646" y="419">over the first 1.5 s</text>
  <line class="par" x1="560" y1="395" x2="520" y2="395" marker-end="url(#uc-p)"/>

  <!-- ===== uplink ===== -->
  <line class="sig" x1="750" y1="470" x2="430" y2="470" marker-end="url(#uc-s)"/>
  <text class="eq" x="725" y="462">x[k]</text>
  <circle cx="700" cy="470" r="3.5" fill="#3e4c59"/>
  <line class="sig" x1="700" y1="466" x2="700" y2="426" marker-end="url(#uc-s)"/>
  <circle class="op" cx="416" cy="470" r="12"/>
  <line class="sig" x1="411" y1="465" x2="421" y2="475"/>
  <line class="sig" x1="411" y1="475" x2="421" y2="465"/>
  <line class="sig" x1="404" y1="470" x2="125" y2="470" marker-end="url(#uc-s)"/>
  <text class="eq" x="360" y="462">y[k]</text>
  <text class="eq" x="205" y="462">y<tspan class="sub" dy="3">i</tspan><tspan dy="-3">[k]</tspan></text>

  <!-- broker uplink sum -->
  <circle class="op" cx="110" cy="470" r="13"/>
  <text x="110" y="476" style="font-size:16px;fill:#1f2933">Σ</text>
  <line class="sig" x1="110" y1="414" x2="110" y2="455" marker-end="url(#uc-s)"/>
  <text class="s st" x="118" y="422">from UEs j ≠ i</text>
  <rect x="72" y="506" width="150" height="28" rx="5" fill="#ffffff" stroke="#7b8794" stroke-width="1.3"/>
  <text class="eq" x="147" y="525">n[k] ~ <tspan style="font-style:normal">CN</tspan>(0, N<tspan class="sub" dy="3">floor</tspan><tspan dy="-3">)</tspan></text>
  <line class="sig" x1="110" y1="506" x2="110" y2="485" marker-end="url(#uc-s)"/>
  <line class="sig" x1="97" y1="470" x2="52" y2="470" marker-end="url(#uc-s)"/>
  <text class="eq" x="76" y="462">r[k]</text>

  <!-- note -->
  <text class="s" x="521" y="530">snr = 10<tspan dy="-5" style="font-size:10px">SNR/10</tspan><tspan dy="5"> (linear)</tspan></text>
</svg>
