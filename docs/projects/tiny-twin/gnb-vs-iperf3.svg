<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 352" width="780" height="352" role="img">
  <title>gNB throughput against iperf3 at the UEs</title>
  <desc>Each bar is the gNB's throughput per air-second, split into what iperf3 received at the UEs, header and undelivered bytes, and the share lost because the chain ran below real time. Clean, 4 UEs, 100 percent: 63.2 gNB, 59.4 iperf3. Clean, 4 UEs, 88 percent: 63.4 gNB, 56.1 per wall-clock second, 52.3 iperf3. CQI walks, 4 UEs: 40.9 gNB, 37.4 iperf3. CQI walks, 2 UEs, 97 percent: 28.9 gNB, 28.1 per wall-clock second, 24.6 iperf3.</desc>
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; fill: #52606d; font-size: 13px; }</style>
  <rect width="780" height="352" fill="#ffffff"/>
  <text x="16.0" y="28.0" style="font-size:14px;fill:#1f2933;font-weight:700" text-anchor="start">gNB throughput vs iperf3 at the UEs</text>
  <text x="16.0" y="46.0" style="font-size:12.5px;fill:#7b8794;font-weight:400" text-anchor="start">Bar length: gNB throughput per air-second (DRB bytes scheduled), Mbit/s</text>
  <rect x="16" y="62" width="12" height="12" rx="2" fill="#2a78d6"/>
  <text x="34.0" y="72.5" style="font-size:12.5px;fill:#52606d;font-weight:400" text-anchor="start">received, iperf3 (UDP)</text>
  <rect x="218.4" y="62" width="12" height="12" rx="2" fill="#eb6834"/>
  <text x="236.4" y="72.5" style="font-size:12.5px;fill:#52606d;font-weight:400" text-anchor="start">headers, undelivered bytes</text>
  <rect x="449.6" y="62" width="12" height="12" rx="2" fill="#1baf7a"/>
  <text x="467.6" y="72.5" style="font-size:12.5px;fill:#52606d;font-weight:400" text-anchor="start">chain below real time</text>
  <line x1="214.0" y1="92" x2="214.0" y2="302" stroke="#9aa5b1" stroke-width="1"/>
  <text x="214.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">0</text>
  <line x1="284.0" y1="92" x2="284.0" y2="302" stroke="#e4e7eb" stroke-width="1"/>
  <text x="284.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">10</text>
  <line x1="354.0" y1="92" x2="354.0" y2="302" stroke="#e4e7eb" stroke-width="1"/>
  <text x="354.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">20</text>
  <line x1="424.0" y1="92" x2="424.0" y2="302" stroke="#e4e7eb" stroke-width="1"/>
  <text x="424.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">30</text>
  <line x1="494.0" y1="92" x2="494.0" y2="302" stroke="#e4e7eb" stroke-width="1"/>
  <text x="494.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">40</text>
  <line x1="564.0" y1="92" x2="564.0" y2="302" stroke="#e4e7eb" stroke-width="1"/>
  <text x="564.0" y="320.0" style="font-size:12px;fill:#7b8794;font-weight:400" text-anchor="middle">50</text>
