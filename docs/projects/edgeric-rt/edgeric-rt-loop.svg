<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 582" width="780" height="582" role="img" aria-labelledby="rt-title rt-desc">
  <title id="rt-title">EdgeRIC-RT scheduling loop</title>
  <desc id="rt-desc">Three pods. At the end of slot t, the OCUDU gNB's MAC scheduler calls the mac_sched_slot_report hook, and the rt_report jbpf codelet sends a 1080-byte report of each UE's CQI and backlog over jbpf shared memory to rt_bridge, a jrtc Python xApp, which forwards it over a Unix socket to the scheduler muApp in pod edgeric-0. The muApp (PPO, max-weight, PF or round robin) answers with a 168-byte action, a weight per UE for slot t+1. rt_bridge writes it into rt_act_in, the input channel of the rt_ctrl codelet, which hands it to the scheduler through the mac_sched_slot_ctrl hook at the start of slot t+1. The loop closes within one 0.5 ms slot.</desc>
  <defs>
    <marker id="rt-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/>
    </marker>
    <marker id="rt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0561b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; fill: #3e4c59; font-size: 14px; }
    .t { font-size: 16px; font-weight: 700; fill: #1f2933; }
    .m { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .tm { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; fill: #1f2933; }
    .s { font-size: 13px; fill: #616e7c; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .pod { fill: #fafbfc; stroke: #9aa5b1; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .box { fill: #eef2f7; stroke: #5b6b82; stroke-width: 1.5; }
    .rep { stroke: #2f6db5; stroke-width: 2.2; fill: none; }
    .act { stroke: #c0561b; stroke-width: 2.2; fill: none; }
    .lrep { fill: #2f6db5; font-weight: 700; }
    .lact { fill: #c0561b; font-weight: 700; }
    .step circle { fill: #1f2933; stroke: #ffffff; stroke-width: 2; }
    .step text { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect width="780" height="582" fill="#ffffff"/>

  <!-- pods, each labelled on its top edge -->
  <rect class="pod" x="12" y="20" width="756" height="120" rx="12"/>
  <rect x="26" y="10" width="160" height="20" fill="#ffffff"/>
  <text class="s" x="34" y="25">muApps · pod edgeric-0</text>

  <rect class="pod" x="12" y="212" width="756" height="86" rx="12"/>
  <rect x="26" y="202" width="108" height="20" fill="#ffffff"/>
  <text class="s" x="34" y="217">jrtc · pod jrtc-0</text>

  <rect class="pod" x="12" y="370" width="756" height="200" rx="12"/>
  <rect x="26" y="360" width="214" height="20" fill="#ffffff"/>
  <text class="s" x="34" y="375">OCUDU gNB · pod srs-gnb-du1-0</text>

  <!-- muApp -->
  <rect class="box" x="190" y="40" width="400" height="80" rx="8"/>
  <text class="t c" x="390" y="65">Scheduler muApp</text>
  <text class="m c" x="390" y="87">sched_muapp.py · train_ppo.py</text>
  <text class="s c" x="390" y="108">PPO (RL), max-weight, PF, round robin, …</text>

  <!-- rt_bridge -->
  <rect class="box" x="190" y="230" width="400" height="52" rx="8"/>
  <text class="tm c" x="390" y="253">rt_bridge</text>
  <text class="s c" x="390" y="273">jrtc Python xApp</text>

  <!-- codelets -->
  <rect class="box" x="210" y="390" width="160" height="52" rx="8"/>
  <text class="tm c" x="290" y="413">rt_ctrl</text>
  <text class="s c" x="290" y="433">jbpf codelet</text>
  <rect class="box" x="410" y="390" width="160" height="52" rx="8"/>
  <text class="tm c" x="490" y="413">rt_report</text>
  <text class="s c" x="490" y="433">jbpf codelet</text>

  <!-- MAC scheduler -->
  <rect class="box" x="150" y="506" width="480" height="52" rx="8"/>
  <text class="t c" x="390" y="528">MAC scheduler</text>
  <text class="s c" x="390" y="548">splits the slot's RBs by the weights, or falls back to its own PF</text>

  <!-- report: up the right side -->
  <line class="rep" x1="490" y1="505" x2="490" y2="444" marker-end="url(#rt-r)"/>
  <line class="rep" x1="490" y1="389" x2="490" y2="284" marker-end="url(#rt-r)"/>
  <line class="rep" x1="490" y1="229" x2="490" y2="122" marker-end="url(#rt-r)"/>

  <!-- action: down the left side -->
  <line class="act" x1="290" y1="121" x2="290" y2="228" marker-end="url(#rt-a)"/>
  <line class="act" x1="290" y1="283" x2="290" y2="388" marker-end="url(#rt-a)"/>
  <line class="act" x1="290" y1="443" x2="290" y2="504" marker-end="url(#rt-a)"/>

  <!-- labels between muApp and rt_bridge -->
  <text class="lact e" x="274" y="171">action · 168 B</text>
  <text class="s e" x="274" y="189">a weight per UE, for slot t+1</text>
  <text class="lrep" x="506" y="171">report · 1080 B</text>
  <text class="s" x="506" y="189">each UE's CQI and backlog</text>
  <text class="s c" x="390" y="181">Unix socket</text>

  <!-- labels between rt_bridge and the codelets -->
  <text class="m e" x="276" y="329">rt_act_in</text>
  <text class="s e" x="276" y="347">input channel</text>
  <text class="s c" x="390" y="339">jbpf shared memory</text>

  <!-- hooks -->
  <text class="m e" x="274" y="469">mac_sched_slot_ctrl</text>
  <text class="s e" x="274" y="487">hook · start of slot t+1</text>
  <text class="m" x="506" y="469">mac_sched_slot_report</text>
  <text class="s" x="506" y="487">hook · end of slot t</text>
  <text class="s c" x="390" y="469">loop closes within</text>
  <text class="s c" x="390" y="487">one slot (0.5 ms)</text>

  <!-- steps, as numbered in the text -->
  <g class="step"><circle cx="490" cy="474" r="11"/><text x="490" y="478.5">1</text></g>
  <g class="step"><circle cx="190" cy="80" r="11"/><text x="190" y="84.5">2</text></g>
  <g class="step"><circle cx="290" cy="176" r="11"/><text x="290" y="180.5">3</text></g>
  <g class="step"><circle cx="290" cy="474" r="11"/><text x="290" y="478.5">4</text></g>
</svg>
